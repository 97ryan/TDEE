name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # only used on tag builds, to attach the APK to the GitHub Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build release APK
        run: |
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TDEE-${GITHUB_REF_NAME//\//-}.apk

      # Artifacts count against the account's Actions storage quota; never fail the build on it.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: TDEE-apk
          path: dist/*.apk
          retention-days: 7

      # Tag v1.2.3 → GitHub Release with the APK attached (not subject to the artifact quota).
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk --title "TDEE $GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber
